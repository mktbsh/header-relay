name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-header-relay
  cancel-in-progress: false

jobs:
  version:
    name: Version or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # changesets/action pushes commits and tags through the GitHub API.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          # Keep in sync with mise.toml.
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Keep in sync with mise.toml.
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or tag release
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: pnpm release:version
          publish-script: pnpm release:tag
          commit-message: "chore: release"
          pr-title: "chore: release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Immutable releases reject assets added after publishing, so the release job creates the release with the zip.
          create-github-releases: false

  build:
    name: Build extension zip
    needs: version
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          # Keep in sync with mise.toml.
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Keep in sync with mise.toml.
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension zip
        run: pnpm zip

      - name: Collect release files
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          # upload-artifact skips files under dot-directories such as .output, so stage them elsewhere.
          mkdir release
          cp .output/*.zip release/
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/release-notes.md
          test -s release/release-notes.md
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/*.zip
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    # Waits for a required reviewer before the token can create the release.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create GitHub release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file release/release-notes.md

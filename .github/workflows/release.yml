name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-header-relay
  cancel-in-progress: false

jobs:
  release:
    name: Version or release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          # Keep in sync with mise.toml.
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Keep in sync with mise.toml.
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or tag release
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: pnpm release:version
          publish-script: pnpm release:tag
          commit-message: "chore: release"
          pr-title: "chore: release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: true

      - name: Build extension zip
        if: steps.changesets.outputs.published == 'true'
        run: pnpm zip

      - name: Upload zip to GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "v${version}" .output/*.zip --clobber
